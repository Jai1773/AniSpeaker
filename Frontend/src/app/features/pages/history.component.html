<app-nav /><main class="page container"><h1 class="page-title">Recently Watched</h1>@for(item of remote;track item.episode.id){<article class="history"><img [src]="item.content.bannerUrl || item.content.posterUrl"><div><h3>{{item.content.title}}</h3><p>{{item.episode.title}}</p></div><a class="btn primary" [routerLink]="['/watch',item.content.slug]" [queryParams]="{episode:item.episode.id}">Continue</a></article>}@for(item of guest;track item.episodeId){<article class="history"><img [src]="item.image"><div><h3>{{item.title}}</h3><p>{{item.progressSeconds}} seconds watched</p></div><a class="btn primary" [routerLink]="['/watch',item.slug]" [queryParams]="{episode:item.episodeId}">Continue</a></article>}<button class="clear" (click)="clear()">Clear guest history</button></main><app-footer />
