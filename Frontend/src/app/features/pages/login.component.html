<main class="auth"><a routerLink="/" class="logo">AniSpeaker</a><section><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your stories.</h1><p class="auth-copy">Your Watch Later and playback progress follow you across devices.</p><form (ngSubmit)="submit()"><label>Email<input [(ngModel)]="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input [(ngModel)]="password" name="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" [disabled]="loading">{{loading ? 'Signing in…' : 'Sign In'}}</button></form>@if(error){<p class="form-error" role="alert">{{error}}</p>}<p>Don’t have an account? <a routerLink="/register">Create one</a></p></section></main>
