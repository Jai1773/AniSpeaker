@if (loadingService.isLoading()) {
  <!-- Top Slim Glowing Progress Bar (Instant Feedback) -->
  <div class="top-loader-bar" role="progressbar" aria-label="Loading">
    <div class="top-loader-indicator"></div>
  </div>

  <!-- Center Anime Loader Overlay (Smooth Backdrop & Pulse) -->
  <div class="loader-overlay" aria-live="polite" aria-busy="true">
    <div class="loader-container">
      <!-- Animated Spinning & Pulsing Rings -->
      <div class="anime-spinner">
        <div class="ring outer-ring"></div>
        <div class="ring middle-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="core-glow">
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
        </div>
      </div>

      <!-- AniSpeaker Animated Brand -->
      <div class="loader-brand">Ani<span>Speaker</span></div>

      <!-- Pulse Status Bar & Dots -->
      <div class="loading-status">
        <span class="status-dot"></span>
        <span class="status-dot"></span>
        <span class="status-dot"></span>
      </div>
    </div>
  </div>
}
